name: ${PROJECT_NAME}

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    container_name: ${PROJECT_NAME}-db
    labels:
      com.project.service: "database"
      com.project.component: "postgresql"
      com.project.version: "18-alpine3.23"
      com.project.description: "PostgreSQL database"
    read_only: true
    tmpfs:
      - /tmp:size=100m
      - /var/run/postgresql:size=10m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${EXPOSE_DB}:5432"
    networks:
      - db_network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "4"

volumes:
  postgres_data:

networks:
  db_network:
    internal: false
